services:
  postgres:
    image: postgres:16-alpine
    container_name: kalpee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kalpee
      POSTGRES_USER: ${POSTGRES_USER:-kalpee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalpee_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kalpee} -d kalpee"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kalpee-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kalpee
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kalpee}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kalpee_secret}
      KALPEE_JWT_SECRET: ${KALPEE_JWT_SECRET:-kalpee-default-super-secret-jwt-key-minimum-256-bits-for-hmac-sha256}
      KALPEE_STORAGE_LOCATION: /var/lib/kalpee/photos
      KALPEE_FRONTEND_URL: ${KALPEE_FRONTEND_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret-placeholder}
    volumes:
      - photos_data:/var/lib/kalpee/photos
    expose:
      - "8081"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kalpee-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${KALPEE_PORT:-8080}:80"

volumes:
  postgres_data:
  photos_data:
