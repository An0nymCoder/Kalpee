server:
  port: ${PORT:${SERVER_PORT:8081}}
  forward-headers-strategy: framework

spring:
  application:
    name: kalpee-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kalpee}
    username: ${SPRING_DATASOURCE_USERNAME:kalpee}
    password: ${SPRING_DATASOURCE_PASSWORD:kalpee_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"

kalpee:
  jwt:
    secret: ${KALPEE_JWT_SECRET:kalpee-default-super-secret-jwt-key-minimum-256-bits-for-hmac-sha256}
    expiration-seconds: 86400
    cookie-name: KALPEE_SESSION
    cookie-secure: ${KALPEE_COOKIE_SECURE:false}
  storage:
    location: ${KALPEE_STORAGE_LOCATION:./uploads/photos}
  frontend-url: ${KALPEE_FRONTEND_URL:http://localhost:5173}
  csrf:
    enabled: ${KALPEE_CSRF_ENABLED:true}

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
