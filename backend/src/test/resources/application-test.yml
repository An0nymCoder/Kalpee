spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"

kalpee:
  jwt:
    secret: test-super-secret-jwt-key-minimum-256-bits-for-hmac-sha256-kalpee
    expiration-seconds: 86400
    cookie-name: KALPEE_SESSION
    cookie-secure: false
  storage:
    location: ./target/test-uploads
  frontend-url: http://localhost:5173
  csrf:
    enabled: true
